<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>{% block title %}{% endblock %}</title>
</head>
<body class="bg-gray-100">
    <nav class="bg-indigo-500 p-4 text-white">
        {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="text-lg font-semibold">Dashboard</a>
        <a href="{% url 'transaction-add' %}" class="text-lg font-semibold ml-4">Add Transaction</a>
        <a href="{% url 'transaction-list' %}" class="text-lg font-semibold ml-4">View Transactions</a>
        <a href="{% url 'goal-add' %}" class="text-lg font-semibold ml-4">Add Goal</a>
        <form id="logout-form" action="{%url 'logout' %}" method="post" style="display:inline">
            {% csrf_token %}
            <a href="#" onclick="document.getElementById('logout-form').submit()" class="text-lg font-semibold ml-4 mr-4">Logout</a>
        </form>
        {% else %}
        <a href="{% url 'login' %}" class="text-lg font-semibold">Login</a>
        <a href="{% url 'register' %}" class="text-lg font-semibold ml-4">Register</a>
        {% endif %}
    </nav>
    {% block content %}{% endblock %}


</body>
</html>
